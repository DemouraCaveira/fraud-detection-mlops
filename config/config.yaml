# Configuração central do projeto — nenhum caminho ou hiperparâmetro fica hardcoded nos scripts.
# Qualquer etapa do pipeline (src/*.py) lê deste arquivo via src/utils.py::load_config().

project:
  name: "fraude-cartao-credito-trilha-a"
  random_seed: 42

data:
  openml_id: 1597               # dataset "creditcard" no OpenML == Kaggle Credit Card Fraud Detection
  raw_cache_path: "data/creditcard_raw.parquet"
  processed_dir: "data/processed"
  # split temporal (por Time, nao aleatorio) para nao vazar informacao futura
  split:
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15

features:
  amount_col: "Amount"
  time_col: "Time"
  target_col: "Class"

training:
  baseline_model: "logistic_regression"
  main_model: "lightgbm"
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
  lightgbm:
    objective: "binary"
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    n_jobs: -1
  hpo:
    method: "optuna"
    n_trials: 40
    timeout_seconds: 300
    early_stopping_rounds: 30   # cada trial para assim que a val nao melhora por 30 rodadas
    search_space:
      # ranges revisados para combater o overfitting observado (treino PR-AUC=1.0): teto
      # de num_leaves/max_depth reduzido, e adicionados regularizacao L1/L2 e subsampling
      # de linhas/colunas por arvore — as tecnicas padrao de mercado contra overfitting
      # em gradient boosting, nao so early stopping
      num_leaves: [7, 63]
      max_depth: [3, 8]
      learning_rate: [0.02, 0.2]
      min_child_samples: [20, 150]
      n_estimators: [100, 600]  # teto — early stopping normalmente para bem antes
      reg_alpha: [0.001, 10.0]       # regularizacao L1
      reg_lambda: [0.001, 10.0]      # regularizacao L2
      feature_fraction: [0.5, 1.0]  # fracao de colunas amostrada por arvore
      bagging_fraction: [0.5, 1.0]  # fracao de linhas amostrada por iteracao
      bagging_freq: [1, 7]          # a cada quantas iteracoes reamostra as linhas

evaluation:
  primary_metric: "average_precision"   # PR-AUC — metrica principal em problema extremamente desbalanceado
  cv_folds: 5
  decision_threshold_strategy: "cost_based"
  cost_matrix:
    false_negative_cost: 100   # deixar passar uma fraude custa muito mais que...
    false_positive_cost: 1     # ...bloquear uma transacao legitima por engano
  scale_benchmark:
    # ate 20x (~4M linhas) ja demonstra o comportamento assintotico com folga e mantem o
    # benchmark completo rodavel em poucos minutos (importante para reproduzir ao vivo em
    # aula); tiers maiores (40x/8M) foram tentados e, alem de nao acrescentarem sinal novo
    # a curva, ficaram sujeitos a contencao de recursos da maquina em uso, tornando o
    # tempo medido nao-confiavel para reportar
    row_multipliers: [1, 2, 5, 10, 20]
  complexity_comparison:
    # tamanhos absolutos de treino para comparar latencia de UMA predicao: KNN (O(n)) vs
    # Regressao Logistica (O(d)) vs LightGBM (O(k * log_2 folhas)) — a prova visual de que
    # a escolha do modelo importa mais para performance de producao que o hardware
    row_sizes: [5000, 20000, 50000, 100000, 199364]
    n_query_repeats: 100

paths:
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  mlflow_tracking_uri: "mlruns"
